name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/cloudflare-worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm install --frozen-lockfile
        working-directory: examples/cloudflare-worker
      - run: pnpm run build
        working-directory: examples/cloudflare-worker
      - name: Save validated demo assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-demo-assets
          path: examples/cloudflare-worker/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy-demo:
    name: Deploy Cloudflare Worker Demo
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: cloudflare-worker-demo
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/cloudflare-worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: examples/cloudflare-worker
      - name: Restore validated demo assets
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-worker-demo-assets
          path: examples/cloudflare-worker/dist

      - name: Check deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          DLBR_EID_API_KEY: ${{ secrets.DLBR_EID_API_KEY }}
          DLBR_EID_INTENDED_USE_ID: ${{ vars.DLBR_EID_INTENDED_USE_ID }}
        run: |
          node --input-type=module <<'NODE'
          const required = [
            'CLOUDFLARE_API_TOKEN',
            'CLOUDFLARE_ACCOUNT_ID',
            'D1_DATABASE_ID',
            'DLBR_EID_API_KEY',
            'DLBR_EID_INTENDED_USE_ID',
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) throw new Error(`Missing GitHub Actions settings: ${missing.join(', ')}`);
          if (!/^[0-9a-f-]{36}$/i.test(process.env.D1_DATABASE_ID)) {
            throw new Error('D1_DATABASE_ID must be a UUID.');
          }
          NODE

      - name: Verify D1 database ID
        working-directory: examples/cloudflare-worker
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = readFileSync('wrangler.jsonc', 'utf8');
          const configuredId = /"database_id"\s*:\s*"([^"]+)"/.exec(config)?.[1];
          if (configuredId !== process.env.D1_DATABASE_ID) {
            throw new Error('wrangler.jsonc database_id must match the D1_DATABASE_ID repository variable.');
          }
          NODE

      - name: Apply D1 migrations
        working-directory: examples/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply eid-age-check-demo --remote

      - name: Deploy Worker and static assets
        working-directory: examples/cloudflare-worker
        run: pnpm exec wrangler deploy --var "DLBR_EID_INTENDED_USE_ID:${DLBR_EID_INTENDED_USE_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DLBR_EID_INTENDED_USE_ID: ${{ vars.DLBR_EID_INTENDED_USE_ID }}

      - name: Publish Gateway API key as a Worker secret
        working-directory: examples/cloudflare-worker
        run: |
          secret_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.SECRET_FILE, JSON.stringify({ DLBR_EID_API_KEY: process.env.DLBR_EID_API_KEY }), { mode: 0o600 });
          NODE
          pnpm exec wrangler secret bulk "$secret_file"
        env:
          SECRET_FILE: ${{ runner.temp }}/worker-secrets.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DLBR_EID_API_KEY: ${{ secrets.DLBR_EID_API_KEY }}
