name: Deploy Cloudflare Worker Demo

on:
  push:
    branches: [main]
    paths:
      - "examples/cloudflare-worker/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  pull_request:
    paths:
      - "examples/cloudflare-worker/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-demo
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/cloudflare-worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:coverage

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:e2e

      - run: pnpm install --frozen-lockfile
        working-directory: examples/cloudflare-worker
      - run: pnpm run build
        working-directory: examples/cloudflare-worker

      - name: Check deployment settings
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          DLBR_EID_API_KEY: ${{ secrets.DLBR_EID_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const required = [
            'CLOUDFLARE_API_TOKEN',
            'CLOUDFLARE_ACCOUNT_ID',
            'D1_DATABASE_ID',
            'DLBR_EID_API_KEY',
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) throw new Error(`Missing GitHub Actions settings: ${missing.join(', ')}`);
          if (!/^[0-9a-f-]{36}$/i.test(process.env.D1_DATABASE_ID)) {
            throw new Error('D1_DATABASE_ID must be a UUID.');
          }
          NODE

      - name: Set D1 database ID
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: examples/cloudflare-worker
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'wrangler.jsonc';
          const config = readFileSync(path, 'utf8');
          const placeholder = '00000000-0000-0000-0000-000000000000';
          if (!config.includes(placeholder)) throw new Error('D1 database placeholder was not found.');
          writeFileSync(path, config.replace(placeholder, process.env.D1_DATABASE_ID));
          NODE

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: examples/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply eid-age-check-demo --remote

      - name: Deploy Worker and static assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: examples/cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Publish Gateway API key as a Worker secret
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: examples/cloudflare-worker
        run: |
          secret_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.SECRET_FILE, JSON.stringify({ DLBR_EID_API_KEY: process.env.DLBR_EID_API_KEY }), { mode: 0o600 });
          NODE
          pnpm exec wrangler secret bulk "$secret_file"
        env:
          SECRET_FILE: ${{ runner.temp }}/worker-secrets.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DLBR_EID_API_KEY: ${{ secrets.DLBR_EID_API_KEY }}
